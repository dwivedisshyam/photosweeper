<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhotoSweeper - Electron</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="logo">PS</div>
        <div class="titleWrap">
          <h1>PhotoSweeper</h1>
          <div class="subtitle">Inspect • Cull • Restore</div>
        </div>
      </div>
      <div class="headerActions">
        <div class="headerControls">
          <button
            id="addToDelete"
            title="Toggle delete for current image"
            aria-label="Add to delete"
            class="icon"
          >
            <!-- remove circle icon (meaning: mark/remove) -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.4" />
              <path
                d="M8 12h8"
                stroke="#fff"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            id="reviewDelete"
            title="Review delete list"
            aria-label="Review delete list"
            class="icon"
          >
            <!-- eye icon (meaning: review) -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"
                stroke="#fff"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="12" r="3" stroke="#fff" stroke-width="1.4" />
            </svg>
            <span id="reviewBadge" class="badge" style="display: none">0</span>
          </button>
        </div>
        <button
          id="selectFolder"
          class="icon"
          title="Select folder"
          aria-label="Select folder"
        >
          <!-- folder open icon -->
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"
              stroke="#04202a"
              stroke-width="1.2"
              fill="#fff"
            />
          </svg>
        </button>
      </div>
    </header>
    <main id="container">
      <aside id="controls">
        <!-- controls column (left) - delete count moved to header badge -->
      </aside>
      <section id="viewer">
        <div id="viewerInner">
          <img id="mainImage" alt="Selected" />
          <div id="imageInfo"></div>
        </div>
      </section>

      <nav id="thumbRibbon" aria-label="Thumbnails"></nav>
    </main>

    <!-- Review modal -->
    <div id="reviewModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modalContent">
        <h2>Review Deletions</h2>
        <div id="reviewList" class="reviewList"></div>
        <div class="modalActions">
          <button id="cancelReview" title="Cancel" aria-label="Cancel">
            <!-- cross icon -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M6 6l12 12M6 18L18 6"
                stroke="#fff"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            id="confirmDelete"
            class="danger"
            title="Delete"
            aria-label="Delete"
          >
            <!-- trash icon -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- Lid -->
              <path
                d="M4 7H20"
                stroke="#fff"
                stroke-width="1.6"
                stroke-linecap="round"
              />

              <!-- Handle -->
              <path
                d="M9 4H15"
                stroke="#fff"
                stroke-width="1.6"
                stroke-linecap="round"
              />

              <!-- Bin Body -->
              <path
                d="M7 7V18C7 19.1 7.9 20 9 20H15C16.1 20 17 19.1 17 18V7"
                stroke="#fff"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <!-- Inner lines -->
              <path
                d="M10 11V16"
                stroke="#fff"
                stroke-width="1.6"
                stroke-linecap="round"
              />
              <path
                d="M14 11V16"
                stroke="#fff"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
